services:
  # Local development only; account storage is separate from application data.
  keycloak:
    restart: unless-stopped
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: dev-file
      KC_HOSTNAME: ${KEYCLOAK_URL:-http://localhost:${WEB_PORT:-8080}/auth}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-trace-dev-admin}
      TRACE_WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:${WEB_PORT:-8080}}
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./deploy/keycloak/trace-realm.json:/opt/keycloak/data/import/trace-realm.json:ro
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'HEAD /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; read -r status <&3; [[ $$status == *' 200 '* ]]"
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 30
  postgres:
    restart: unless-stopped
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: trace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trace}
      POSTGRES_DB: trace
    volumes:
      - v1_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trace -d trace"]
      interval: 3s
      timeout: 3s
      retries: 20
  sop-postgres:
    restart: unless-stopped
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: trace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trace}
      POSTGRES_DB: trace_sop
    volumes:
      - sop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trace -d trace_sop"]
      interval: 3s
      timeout: 3s
      retries: 20
  seed:
    build: ./mcp
    command: ["uv", "run", "python", "/seed/seed.py"]
    environment:
      DATABASE_URL: postgresql://trace:${POSTGRES_PASSWORD:-trace}@postgres:5432/trace
    volumes:
      - ./db:/seed:ro
    depends_on:
      postgres:
        condition: service_healthy
  backend:
    restart: unless-stopped
    build: ./backend
    environment:
      DATABASE_URL: postgresql://trace:${POSTGRES_PASSWORD:-trace}@postgres:5432/trace
      AGENT_URL: http://agent:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-trace-local-development}
      SOP_DOCUMENTS_DIR: /sop
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://localhost:${WEB_PORT:-8080}/auth}
      KEYCLOAK_REALM: trace
      KEYCLOAK_CLIENT_ID: trace-web
      KEYCLOAK_AUDIENCE: trace-api
      KEYCLOAK_JWKS_URL: http://keycloak:8080/auth/realms/trace/protocol/openid-connect/certs
      # Alert intake polls the prometheus service; set PROMETHEUS_URL= to disable (docs/agent-request.md)
      PROMETHEUS_URL: ${PROMETHEUS_URL-http://prometheus:9090}
    volumes:
      - ./sop-ocap:/sop:ro
    depends_on:
      keycloak:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json',timeout=2).close()"]
      interval: 3s
      timeout: 5s
      retries: 20
  business-mcp:
    restart: unless-stopped
    build: ./mcp
    command: ["uv", "run", "python", "business.py"]
    environment:
      BACKEND_URL: http://backend:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-trace-local-development}
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import socket; socket.create_connection(('localhost',8000),2).close()"]
      interval: 3s
      timeout: 5s
      retries: 20
  rag-mcp:
    restart: unless-stopped
    build: ./mcp
    command: ["uv", "run", "python", "rag.py"]
    environment:
      DATABASE_URL: postgresql://trace:${POSTGRES_PASSWORD:-trace}@postgres:5432/trace
      SOP_DATABASE_URL: postgresql://trace:${POSTGRES_PASSWORD:-trace}@sop-postgres:5432/trace_sop
      SOP_DOCUMENTS_DIR: /sop
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./sop-ocap:/sop:ro
    depends_on:
      seed:
        condition: service_completed_successfully
      sop-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import socket; socket.create_connection(('localhost',8000),2).close()"]
      interval: 3s
      timeout: 5s
      retries: 20
  physics-mcp:
    build: ./mcp
    command: ["uv", "run", "python", "physics.py"]
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import socket; socket.create_connection(('localhost',8000),2).close()"]
      interval: 3s
      timeout: 5s
      retries: 20
  agent:
    restart: unless-stopped
    build: ./agent
    environment:
      DATABASE_URL: postgresql://trace:${POSTGRES_PASSWORD:-trace}@postgres:5432/trace
      BACKEND_URL: http://backend:8000
      BUSINESS_MCP_URL: http://business-mcp:8000/mcp
      RAG_MCP_URL: http://rag-mcp:8000/mcp
      PHYSICS_MCP_URL: http://physics-mcp:8000/mcp
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-trace-local-development}
      LANGSMITH_TRACING: "${LANGSMITH_TRACING:-false}"
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-etch-trace-dev}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_WORKSPACE_ID: ${LANGSMITH_WORKSPACE_ID:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    depends_on:
      seed:
        condition: service_completed_successfully
      business-mcp:
        condition: service_healthy
      rag-mcp:
        condition: service_healthy
      physics-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json',timeout=2).close()"]
      interval: 3s
      timeout: 5s
      retries: 20
  # Rule-based FDC over the mock fab collector (backend/prometheus/targets.json); internal only, no host port.
  prometheus:
    restart: unless-stopped
    image: prom/prometheus:v2.53.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./backend/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    restart: unless-stopped
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      keycloak:
        condition: service_healthy
      backend:
        condition: service_healthy
volumes:
  keycloak_data:
  prometheus_data:
  v1_pgdata:
  sop_pgdata:
