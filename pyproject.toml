[project]
name = "etch-trace-dev"
version = "1.0.0"
description = "Repository development tooling for TRACE v1 services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
