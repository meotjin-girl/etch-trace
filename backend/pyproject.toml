[project]
name = "trace-agent"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "fastmcp>=3.2,<4",
  "uvicorn",
  "langgraph",
  "langgraph-checkpoint-postgres",
  "langchain-openai",
  "psycopg[binary,pool]",
  "python-dotenv",
  "anyio",
  "httpx2",
  "PyJWT[crypto]>=2.10,<3",
]

[dependency-groups]
dev = ["pytest", "httpx", "ruff", "basedpyright"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.basedpyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["*.py"]
executionEnvironments = [{ root = "tests", extraPaths = ["."] }, { root = "." }]
