# 서버 배포용. 외부 공개는 web:80 하나. agent·postgres는 docker network 안에만 존재
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: trace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trace}
      POSTGRES_DB: trace
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "trace"]
      interval: 3s
      retries: 20
    restart: unless-stopped
  agent:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://trace:${POSTGRES_PASSWORD:-trace}@postgres:5432/trace
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
  web:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [agent]
    restart: unless-stopped
volumes:
  pgdata:
