map $http_host $external_port {
  default $server_port;
  ~:(?<public_port>[0-9]+)$ $public_port;
}

map "$request_method:$uri" $agent_browser_mutation {
  default 0;
  ~^POST:/agent/threads/[0-9a-fA-F-]+(/state)?$ 1;
}

server {
  listen 80;
  root /usr/share/nginx/html;  # frontend 빌드 결과(dist), frontend/Dockerfile
  resolver 127.0.0.11 valid=5s ipv6=off;

  location = /auth {
    return 308 $scheme://$http_host/auth/;
  }

  location /auth/ {
    set $keycloak http://keycloak:8080;
    proxy_pass $keycloak;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $external_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Forwarded "";
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
  }

  location /api/ {
    set $backend http://backend:8000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # SSE: 버퍼링하면 진행 이벤트가 몰려서 도착함
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # Only conversation reads and runs are exposed to browsers. JWT validation is
  # performed by Agent Server; routing alone does not authenticate a request.
  location ~ ^/agent/(threads(/[0-9a-fA-F-]+(/state|/runs(/[0-9a-fA-F-]+(/join|/stream))?)?)?|threads/[0-9a-fA-F-]+/runs/(stream|wait))$ {
    if ($request_method !~ ^(GET|POST|OPTIONS)$) { return 405; }
    # State and thread details are read-only, even though Agent Server also has
    # mutation endpoints at these paths.
    if ($agent_browser_mutation) { return 405; }
    set $agent_server http://agent-new:2024;
    rewrite ^/agent/(.*)$ /$1 break;
    proxy_pass $agent_server;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Internal-Key "";
    proxy_set_header X-Auth-Scheme "";
    proxy_set_header X-Api-Key "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /agent/ {
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
