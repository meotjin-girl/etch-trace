server {
  listen 80;
  root /usr/share/nginx/html;  # frontend/ 정적 파일
  resolver 127.0.0.11 valid=5s ipv6=off;

  # 조사 이력의 목록·상세 조회 요청을 Business MCP 서버의 HTTP API로 직접 전달
  location ~ ^/api/ai/investigations(?:/[^/]+)?$ {
    set $business_mcp http://business-mcp:8000;
    proxy_pass $business_mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-User-Name $http_x_user_name;
    proxy_set_header X-User-Role $http_x_user_role;
    proxy_read_timeout 35s;
  }

  location /api/ {
    set $backend http://backend:8000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # SSE: 버퍼링하면 진행 이벤트가 몰려서 도착함
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
