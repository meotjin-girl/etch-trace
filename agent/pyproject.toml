[project]
name = "trace-agent"
version = "1.0.0"
description = "Standalone TRACE investigation graph for LangGraph Server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.9,<5",
    "fastmcp>=2.14,<3",
    "langchain-openai>=1.0,<2",
    "langgraph>=1.0,<2",
    "langgraph-cli[inmem]>=0.4,<1",
    "langgraph-sdk>=0.3,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9,<3",
    "pyjwt[crypto]>=2.10,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trace_agent"]

[dependency-groups]
dev = ["basedpyright>=1.31", "pytest>=8.4", "ruff>=0.12"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.12"
include = ["src", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "D", "SLF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
