[project]
name = "etch-trace-mcp"
version = "1.0.0"
description = "Deterministic demo evidence tools for Etch Trace"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.2,<4",
    "openai>=2,<3",
    "psycopg[binary]>=3.2,<4",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8,<10", "basedpyright>=1.30", "ruff>=0.11"]
rag-experiment = [
    "python-dotenv>=1,<2",
    "typer>=0.16,<1",
]

[tool.basedpyright]
include = ["*.py", "../db/seed.py", "../tests/test_evidence.py"]
extraPaths = [".", "../db"]
venvPath = "."
venv = ".venv"
