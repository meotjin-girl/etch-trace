services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: trace
      POSTGRES_PASSWORD: trace
      POSTGRES_DB: trace_sop
    ports:
      - "127.0.0.1:${SOP_DB_PORT:-55432}:5432"
    volumes:
      - sop_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trace -d trace_sop"]
      interval: 1s
      timeout: 3s
      retries: 30
volumes:
  sop_data:
